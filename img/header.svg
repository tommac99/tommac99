<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 262" width="860" height="262" role="img" aria-label="whoami: Thomas MacFarlaine, Applied AI Engineer x Product">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f1c"/>
      <stop offset="100%" stop-color="#12302b"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .cmd  { font-size: 19px; fill: #e8f2f0; }
      .line { font-size: 15.5px; fill: #cfe0dc; }
      .tealtext { fill: #2dd4bf; }
      .muted { fill: #6f8a84; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="261" rx="12" fill="url(#bg)" stroke="#1c3b36"/>
  <path d="M0 38 H860" stroke="#1c3b36" stroke-width="1"/>
  <circle cx="24" cy="19.5" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="19.5" r="5.5" fill="#febc2e"/>
  <circle cx="64" cy="19.5" r="5.5" fill="#28c840"/>
  <text class="mono" x="796" y="24" font-size="12" fill="#4a6b64">tommac99</text>

  <text class="mono cmd" x="30" y="82">
    <tspan class="tealtext">&gt;</tspan><tspan fill="#28c840" dx="10">✓</tspan><tspan fill="#e8f2f0" dx="10">whoami</tspan>
  </text>

  <circle cx="36" cy="118" r="3.5" fill="#2dd4bf"/>
  <text class="mono line" x="52" y="123" xml:space="preserve"><tspan fill="#ffffff">Thomas MacFarlaine</tspan><tspan class="muted">  ·  </tspan><tspan class="tealtext">Applied AI Engineer × Product</tspan></text>

  <circle cx="36" cy="152" r="3.5" fill="#2dd4bf"/>
  <text class="mono line" x="52" y="157" xml:space="preserve">Building, shipping, and measuring AI agent workflows</text>

  <circle cx="36" cy="186" r="3.5" fill="#2dd4bf"/>
  <text class="mono line" x="52" y="191" xml:space="preserve">Founder to exit<tspan class="muted">  ·  </tspan>Shipping software since 2018<tspan class="muted">  ·  </tspan>Vienna</text>

  <text class="mono cmd" x="30" y="228"><tspan class="tealtext">&gt;</tspan></text>
  <rect x="49" y="213" width="9" height="18" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
